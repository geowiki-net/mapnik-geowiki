layers:
- query:
    14: way[highway~'^(primary|secondary|tertiary|residential|unclassified)(_link|)$']
  feature:
    style:
      color: red
      width: 2
      text: |
        {{ tags.name }}

- query:
    14: way[railway~'^(rail|tram|subway)$']
  feature:
    style:
      color: blue
      width: 2

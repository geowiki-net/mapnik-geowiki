background: '#ffffff'

layers:
- query: way[highway]
  feature:
    style:
      width: |
        {% if tags.highway in ['primary', 'secondary', 'tertiary'] %}5
        {% elseif tags.highway in ['cycleway', 'footway', 'service'] %}1.5
        {% else %}3
        {% endif %}
      fill: false
      color: '#000000'
      dashArray: |
        {{ tags.highway in ['cycleway', 'footway', 'service'] ? '5,5' : '' }}

- query: nwr[building]
  feature:
    style:
      width: 0.5
      color: '#7f7f7f'
      fill: true
      fillOpacity: 1
      fillColor: '#afafaf'
